# CI de festa-mobile (SCRUM-44).
# 1) Escaneo de secretos y dependencias vulnerables (Trivy lee pubspec.lock): workflow reutilizable de la organización.
#    CodeQL queda apagado: no analiza Dart.
# 2) Formato, linter (flutter analyze con analysis_options.yaml) y pruebas (flutter test), lo mismo que pide el README.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguridad:
    uses: Desparcha2-SWNT/.github/.github/workflows/ci-reusable.yml@main
    # El workflow llamado no puede pedir más permisos que este job (su job de CodeQL pide security-events).
    permissions:
      contents: read
      security-events: write
    with:
      # Este repo compila y prueba en su propio job; el build del CI reutilizable se omite (no queda en verde, queda "skipped").
      stack: none

  flutter:
    name: Formato, linter y pruebas (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar proyecto Flutter
        id: proyecto
        run: |
          if [ -f pubspec.yaml ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aún no hay pubspec.yaml: se omiten los pasos de Flutter."
          fi

      - uses: subosito/flutter-action@v2
        if: steps.proyecto.outputs.existe == 'true'
        with:
          channel: stable
          cache: true

      - name: Dependencias
        if: steps.proyecto.outputs.existe == 'true'
        run: flutter pub get

      - name: Formato (dart format)
        if: steps.proyecto.outputs.existe == 'true'
        run: dart format --output=none --set-exit-if-changed lib test

      # Falla con errores y warnings; los "info" de estilo no bloquean.
      - name: Linter (flutter analyze)
        if: steps.proyecto.outputs.existe == 'true'
        run: flutter analyze --no-fatal-infos

      # El reporter "github" muestra cada prueba fallida como anotación en el PR.
      - name: Pruebas (flutter test)
        if: steps.proyecto.outputs.existe == 'true'
        run: flutter test --reporter github --coverage

      # lcov.info trae, por archivo, líneas encontradas (LF) y cubiertas (LH). Se excluye el código generado (*.g.dart).
      - name: Resumen de cobertura
        if: always() && steps.proyecto.outputs.existe == 'true' && hashFiles('coverage/lcov.info') != ''
        run: |
          awk -F: '/^SF:/ { gen = ($2 ~ /\.g\.dart$/) } /^LF:/ && !gen { lf += $2 } /^LH:/ && !gen { lh += $2 }
            END {
              print "## Cobertura de pruebas (lib/)"
              print ""
              print "| Métrica | Cobertura | Cubiertas |"
              print "|---|---|---|"
              printf "| Líneas | %.2f %% | %d de %d |\n", (lf ? 100 * lh / lf : 0), lh, lf
            }' coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"

      # Análisis de SonarCloud desde el CI, con la cobertura (coverage/lcov.info de flutter test).
      # Requiere SONAR_TOKEN (secreto de la organización) y el análisis automático apagado en el proyecto.
      - name: Análisis de SonarCloud
        if: always() && steps.proyecto.outputs.existe == 'true' && hashFiles('coverage/lcov.info') != ''
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=desparcha2-swnt
            -Dsonar.projectKey=Desparcha2-SWNT_festa-mobile
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.exclusions=**/*.g.dart
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
