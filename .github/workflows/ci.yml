# CI de festa-mobile (SCRUM-44).
# 1) Escaneo de secretos y dependencias vulnerables (Trivy lee pubspec.lock): workflow reutilizable de la organización.
#    CodeQL queda apagado: no analiza Dart.
# 2) Formato, linter (flutter analyze con analysis_options.yaml) y pruebas (flutter test), lo mismo que pide el README.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguridad:
    uses: Desparcha2-SWNT/.github/.github/workflows/ci-reusable.yml@main
    # El workflow llamado no puede pedir más permisos que este job (su job de CodeQL pide security-events).
    permissions:
      contents: read
      security-events: write

  flutter:
    name: Formato, linter y pruebas (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detectar proyecto Flutter
        id: proyecto
        run: |
          if [ -f pubspec.yaml ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aún no hay pubspec.yaml: se omiten los pasos de Flutter."
          fi

      - uses: subosito/flutter-action@v2
        if: steps.proyecto.outputs.existe == 'true'
        with:
          channel: stable
          cache: true

      - name: Dependencias
        if: steps.proyecto.outputs.existe == 'true'
        run: flutter pub get

      - name: Formato (dart format)
        if: steps.proyecto.outputs.existe == 'true'
        run: dart format --output=none --set-exit-if-changed lib test

      # Falla con errores y warnings; los "info" de estilo no bloquean.
      - name: Linter (flutter analyze)
        if: steps.proyecto.outputs.existe == 'true'
        run: flutter analyze --no-fatal-infos

      # El reporter "github" muestra cada prueba fallida como anotación en el PR.
      - name: Pruebas (flutter test)
        if: steps.proyecto.outputs.existe == 'true'
        run: flutter test --reporter github
