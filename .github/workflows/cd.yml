# CD de festa-mobile (SCRUM-45).
# Compila el APK de release y lo publica como un GitHub Release con un QR para instalarlo
# directo en un celular (pilot con estudiantes ECI, sin pasar por Play Store).
#
# Publica solo cuando corre sobre `main`: por un push, o lanzándolo a mano (workflow_dispatch) eligiendo
# la rama `main`. En un PR o al lanzarlo a mano sobre otra rama solo compila el APK y lo deja como
# artefacto de build, sin publicar nada.
#
# Lanzarlo a mano sirve para republicar sin un commit nuevo cuando cambia la URL del backend (cada
# despliegue en el Learner Lab da una URL distinta). La URL puede pasarse como entrada `api_base_url`;
# si se deja vacía, se usa la variable de repositorio API_BASE_URL.
#
# El release se firma con la llave de debug (lo que trae la plantilla de Flutter por defecto):
# suficiente para instalar en los celulares del pilot, no para publicarlo en una tienda.
#
# API_BASE_URL: mientras no haya un gateway desplegado (SCRUM-134, pendiente del laboratorio
# de AWS), el APK apunta por defecto a http://10.0.2.2:8000 (solo sirve en el emulador). Cuando
# haya una URL real, se configura como variable del repositorio (Settings → Variables → Actions)
# con el nombre API_BASE_URL, sin tocar este workflow.
name: CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
    paths:
      - pubspec.yaml
      - pubspec.lock
      - android/**
      - lib/**
      - .github/workflows/cd.yml
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "URL del API (opcional; si se deja vacía se usa la variable de repositorio API_BASE_URL)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build y publicar APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: ¿Publicar esta ejecución?
        id: publicar
        run: echo "si=${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"

      - name: URL del API (dart-define)
        id: api
        env:
          # La entrada tiene prioridad sobre la variable. Van por el entorno y no interpoladas en el
          # script, para que un valor raro no se ejecute como comando.
          URL_ENTRADA: ${{ inputs.api_base_url }}
          URL_VARIABLE: ${{ vars.API_BASE_URL }}
        run: |
          url="${URL_ENTRADA:-$URL_VARIABLE}"
          # Expresión estricta: solo https, host, puerto y ruta con caracteres seguros. Rechaza espacios,
          # saltos de línea, ; | & $ ` y comillas, así que la URL no puede inyectar comandos ni otra salida.
          if [ -n "$url" ] && ! [[ "$url" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~/-]*)?$ ]]; then
            echo "::error::API_BASE_URL no es una URL https válida"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$url" ]; then
            :
          elif [ "${{ steps.publicar.outputs.si }}" = "true" ]; then
            # Publicar un release real sin esto es publicar un APK que ningún celular físico
            # puede usar (queda apuntando a http://10.0.2.2:8000, solo sirve en el emulador) —
            # mejor que el release ni salga a que salga roto y alguien lo escanee sin saberlo.
            echo "::error::Falta la URL del API. No se publica un release con la URL del emulador (los celulares físicos no podrían conectarse). Configura la variable de repositorio API_BASE_URL (Settings → Variables → Actions) o pásala como entrada al lanzar el workflow."
            exit 1
          else
            echo "::notice::No hay variable de repositorio API_BASE_URL: el APK queda apuntando al gateway local (solo sirve en el emulador). Configurarla cuando el gateway esté desplegado."
          fi

      # MAPBOX_ACCESS_TOKEN es el token público (pk.…) de Mapbox, guardado como secreto del repositorio
      # (Settings → Secrets → Actions) para no dejarlo en el código. Sin él, el mapa avisa que no está configurado.
      - name: Compilar APK de release
        env:
          API_URL: ${{ steps.api.outputs.url }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          flutter build apk --release \
            ${API_URL:+--dart-define=API_BASE_URL=$API_URL} \
            ${MAPBOX_TOKEN:+--dart-define=MAPBOX_ACCESS_TOKEN=$MAPBOX_TOKEN}

      - name: Preparar el artefacto
        id: artefacto
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          nombre="festa-mobile-v${version}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$nombre"
          {
            echo "nombre=$nombre"
            echo "tag=mobile-v${version}-${{ github.run_number }}"
          } >> "$GITHUB_OUTPUT"

      - name: Subir el APK como artefacto del build (sin publicar)
        if: steps.publicar.outputs.si != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artefacto.outputs.nombre }}
          path: ${{ steps.artefacto.outputs.nombre }}
          retention-days: 14

      # La URL del asset en un release de GitHub es predecible (releases/download/<tag>/<archivo>),
      # así que el QR se genera antes de publicar y apunta directo a la descarga del APK.
      - name: Generar el QR de instalación
        if: steps.publicar.outputs.si == 'true'
        run: |
          pip install --quiet "qrcode[pil]"
          url="https://github.com/${{ github.repository }}/releases/download/${{ steps.artefacto.outputs.tag }}/${{ steps.artefacto.outputs.nombre }}"
          python3 -c "import qrcode; qrcode.make('$url').save('qr.png')"

      - name: Publicar el release en GitHub
        if: steps.publicar.outputs.si == 'true'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.artefacto.outputs.tag }}
          name: Festa mobile ${{ steps.artefacto.outputs.tag }}
          body: |
            APK de instalación directa para el pilot (no pasa por una tienda de apps).

            Escanea este código o descarga el `.apk` de abajo, e instálalo habilitando "orígenes
            desconocidos" en el celular:

            ![QR de instalación](https://github.com/${{ github.repository }}/releases/download/${{ steps.artefacto.outputs.tag }}/qr.png)
          files: |
            ${{ steps.artefacto.outputs.nombre }}
            qr.png
