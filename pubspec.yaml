name: festa
description: "App móvil de Festa para iOS y Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

# Ícono de la app: solo la corona de Festa (sin el texto). Regenerar con:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icono_festa.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icono_festa_primer_plano.png
  web:
    generate: true
    image_path: assets/icon/icono_festa.png
    background_color: "#FFFFFF"
    theme_color: "#F0127E"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # Tipografías del Figma (OFL, ver assets/fonts/OFL-*.txt). Son fuentes variables: el peso sale del eje wght.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
